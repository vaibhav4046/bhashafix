name: BhashaFix localisation gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-localisation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BHASHAFIX_FAIL_ON: blocking

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web app, CLI and MCP packages
        run: pnpm build

      - name: Run mandatory quality and browser checks
        run: pnpm verify

      # `verify` finishes by restoring the demo fixture to its broken baseline,
      # which is the "before" state of the 10 -> 0 proof. Re-apply the repair so
      # the severity gate below runs against the repaired state, which is what
      # the gate is meant to assert.
      - name: Restore the repaired demo state
        run: pnpm demo:scan && pnpm demo:repair

      - name: Run configured severity gate
        run: >-
          pnpm bhashafix ci
          --config .bhashafix/config.yml
          --fail-on "${BHASHAFIX_FAIL_ON}"
          --no-ai
          --json
          --output artifacts/bhashafix-ci.json

      - name: Generate portable report bundle
        run: pnpm bhashafix report --output artifacts/report

      - name: Write job summary
        if: always()
        run: pnpm tsx scripts/ci-summary.ts

      - name: Upload BhashaFix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhashafix-evidence
          if-no-files-found: warn
          path: |
            artifacts/
            submission/screenshots/
            public/replay/
