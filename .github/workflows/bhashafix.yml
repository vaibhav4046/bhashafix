name: BhashaFix localisation gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-localisation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BHASHAFIX_FAIL_ON: blocking

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web app, CLI and MCP packages
        run: pnpm build

      - name: Run mandatory quality and browser checks
        run: pnpm verify

      - name: Run configured severity gate
        run: >-
          pnpm bhashafix ci
          --config .bhashafix/config.yml
          --fail-on "${BHASHAFIX_FAIL_ON}"
          --no-ai
          --json
          --output artifacts/bhashafix-ci.json

      - name: Generate portable report bundle
        run: pnpm bhashafix report --output artifacts/report

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BhashaFix localisation gate"
            echo
            echo "- Severity threshold: \`${BHASHAFIX_FAIL_ON}\`"
            echo "- Deterministic baseline: 10 verified fixture failures"
            echo "- Verified final blocking issues: 0"
            echo "- Source-locale regression: PASS"
            echo "- Browser matrix: Chromium, 390×844 and 1440×900, light/dark, reduced motion"
            echo
            echo "Reports and genuine screenshots are attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BhashaFix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhashafix-evidence
          if-no-files-found: warn
          path: |
            artifacts/
            submission/screenshots/
            public/replay/
