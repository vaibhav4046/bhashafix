<!doctype html>
<html lang="en-GB" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Northstar clean localisation fixture</title>
    <style>
      body{font:16px/1.5 system-ui;margin:0;padding:40px;background:#fbf8ff;color:#1a1025}
      main{max-width:760px;margin:auto}.cta{width:auto;min-width:120px;padding:12px;white-space:normal}
    </style>
  </head>
  <body>
    <main>
      <h1>Northstar payments</h1>
      <section data-locale="ar-SA" dir="rtl"><h2>المدفوعات العالمية</h2></section>
      <button class="cta" data-locale="de-DE">Sicher weiter zur Zahlung</button>
      <p>Pay {amount}</p>
      <p data-placeholder-source="Pay {amount}">Payer {amount}</p>
      <button data-testid="icon-button" aria-label="Open settings">⚙</button>
    </main>
  </body>
</html>
